name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# publica direto numa branch gh-pages, sem passar pelo sistema de "ambientes"
# do Actions (o metodo com actions/deploy-pages depende de permissoes de
# deployment que nao terminaram de propagar nesse repositorio)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
